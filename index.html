<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新荏田西ポータル</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E6A57" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C3B31" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="荏田西ポータル">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZJ9LQB4X6B"></script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{
  --bg:        #F3F6F5;
  --surface:   #FFFFFF;
  --ink:       #1C2925;
  --ink-2:     #4F605A;
  --ink-3:     #74847E;
  --line:      #DCE3E0;
  --line-2:    #C5D0CB;
  --board:     #2E6A57;   /* 黒板の緑 */
  --board-ink: #FFFFFF;
  --board-soft:#E3EEEA;
  --chalk:     #E9B437;   /* チョークの黄 */
  --chalk-ink: #7A5200;
  --hover:     #EEF3F1;
  --head-bg:   #2E6A57;
  --head-ink:  #FFFFFF;
  --safe:#2F7D4F; --caution:#9A7200; --warn:#B85C00; --danger:#C0392B; --stop:#8E1B5A;
  --radius-s:6px; --radius-m:10px;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121A17; --surface:#19231F; --ink:#E4ECE8; --ink-2:#AEBDB6; --ink-3:#8A9993;
    --line:#2A3631; --line-2:#3A4842; --board:#7FC4A9; --board-ink:#0F1A16; --board-soft:#21342D;
    --chalk:#F0C457; --chalk-ink:#F0C457; --hover:#1F2B26;
    --head-bg:#1C3B31; --head-ink:#E4ECE8;
    --safe:#6FCF97; --caution:#E5C34F; --warn:#F2994A; --danger:#FF7A6B; --stop:#E07BB5;
  }
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
svg.lucide{width:1em;height:1em;stroke-width:2;flex-shrink:0}

/* ===== Header ===== */
.top{background:var(--head-bg);color:var(--head-ink)}
.top-inner{
  max-width:1360px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{width:36px;height:36px;border-radius:8px;background:#fff}
.brand-name{font-size:1.25rem;font-weight:700;letter-spacing:.04em;line-height:1.2}
.brand-school{font-size:.8rem;opacity:.85}
.clock{display:flex;align-items:baseline;gap:12px}
.clock-date{font-size:.95rem;opacity:.9}
.clock-time{font-size:1.75rem;font-weight:700;letter-spacing:.03em;line-height:1}
.duty{font-size:.9rem;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14)}
.duty b{font-size:1.05rem;margin-left:4px}

/* ===== Day timeline (主役) ===== */
.day{background:var(--surface);border-bottom:1px solid var(--line)}
.day-inner{max-width:1360px;margin:0 auto;padding:16px 24px 14px}
.day-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.day-now{font-size:1.15rem;font-weight:700}
.day-now .until{font-size:.9rem;font-weight:400;color:var(--ink-2);margin-left:6px}
.day-note{font-size:.8rem;color:var(--ink-3)}
.track{position:relative;display:flex;height:44px;border-radius:var(--radius-s);overflow:visible}
.seg{
  position:relative;flex-shrink:0;height:100%;
  border-right:2px solid var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;
}
.seg:first-child{border-radius:var(--radius-s) 0 0 var(--radius-s)}
.seg:last-child{border-radius:0 var(--radius-s) var(--radius-s) 0;border-right:none}
.seg.class{background:var(--board-soft);color:var(--board);font-weight:700}
.seg.break{background:repeating-linear-gradient(-45deg,var(--bg),var(--bg) 4px,var(--hover) 4px,var(--hover) 8px)}
.seg.free{background:var(--bg)}
.seg.past{opacity:.45}
.seg.current{background:var(--board);color:var(--board-ink)}
.marker{
  position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;
  background:var(--chalk);border-radius:2px;pointer-events:none;
  box-shadow:0 0 0 2px var(--surface);
}
.marker::before{
  content:"";position:absolute;top:-5px;left:50%;width:11px;height:11px;margin-left:-5.5px;
  border-radius:50%;background:var(--chalk);box-shadow:0 0 0 2px var(--surface);
}
.ticks{position:relative;height:18px;margin-top:6px;font-size:.72rem;color:var(--ink-3)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}

/* ===== Layout ===== */
.info{max-width:1360px;margin:0 auto;padding:20px 24px 0;
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.wrap{max-width:1360px;margin:0 auto;padding:24px}

/* ===== Links ===== */
.finder{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.search{position:relative;flex:1;min-width:240px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:1.1rem}
#q{
  width:100%;padding:12px 64px 12px 42px;font-size:1rem;
  background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--radius-m);
}
#q::placeholder{color:var(--ink-3)}
#q:focus{outline:none;border-color:var(--board);box-shadow:0 0 0 3px var(--board-soft)}
.kbd{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:.72rem;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;
}
.search-hint{font-size:.78rem;color:var(--ink-3);min-height:1.3em;margin-bottom:12px}
.toggle-all{
  flex-shrink:0;padding:11px 16px;font-size:.88rem;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--radius-m);color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;
}
.toggle-all:hover{border-color:var(--board);color:var(--board)}

/* ===== Accordion ===== */
.cats{display:flex;flex-direction:column;gap:8px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden}
.cat-head{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:none;border:none;cursor:pointer;text-align:left;
  box-shadow:inset 4px 0 0 var(--c);
}
.cat-head:hover{background:var(--hover)}
.cat-head:focus-visible{outline-offset:-3px}
.cat-icon{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:1.1rem;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);
}
.cat-name{font-size:1.08rem;font-weight:700}
.cat-count{font-size:.8rem;color:var(--ink-3)}
.cat-peek{display:flex;margin-left:auto;padding-left:12px}
.cat-peek img,.cat-peek span{
  width:22px;height:22px;border-radius:5px;object-fit:contain;
  background:var(--surface);border:1px solid var(--line);margin-left:4px;
  display:grid;place-items:center;font-size:.65rem;font-weight:700;color:var(--ink-2);
}
.cat.open .cat-peek{visibility:hidden}
.cat-chev{font-size:1.2rem;color:var(--ink-3);transition:transform .25s ease}
.cat.open .cat-chev{transform:rotate(180deg);color:var(--c)}
.cat-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.cat.open .cat-body{grid-template-rows:1fr}
.cat-body>div{overflow:hidden;min-height:0}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 16px;
  padding:6px 12px 14px;border-top:1px solid var(--line);margin:0 4px}
.lk{
  display:flex;align-items:center;gap:12px;
  padding:9px 10px;border-radius:var(--radius-s);
  transition:background-color .12s;
}
.lk:hover{background:var(--hover)}
.lk:hover .lk-name{color:var(--board);text-decoration:underline;text-underline-offset:3px}
.lk.first{background:var(--hover);box-shadow:inset 3px 0 0 var(--chalk)}
.lk-ico{
  width:32px;height:32px;flex-shrink:0;border-radius:7px;overflow:hidden;
  display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);
  font-weight:700;color:var(--ink-2);font-size:.95rem;
}
.lk-ico img{width:100%;height:100%;object-fit:contain}
.lk-body{min-width:0}
.lk-name{font-size:.95rem;font-weight:700;line-height:1.35}
.lk-desc{font-size:.78rem;color:var(--ink-2);line-height:1.4}
.lk-int{font-size:.7rem;color:var(--ink-3);margin-left:6px;font-weight:400}
.empty{padding:40px 0;color:var(--ink-2)}
.empty b{color:var(--ink)}
[hidden]{display:none!important}

/* category colors (build.py の color 名に対応) */
.tg-blue{--c:#2F6DB5}.tg-green{--c:#2F7D4F}.tg-purple{--c:#7353B5}.tg-slate{--c:#56656F}
.tg-amber{--c:#B07A00}.tg-teal{--c:#167C80}.tg-rose{--c:#B8456A}.tg-indigo{--c:#4752B8}
@media (prefers-color-scheme: dark){
  .tg-blue{--c:#7FB2F0}.tg-green{--c:#6FCF97}.tg-purple{--c:#B49AF0}.tg-slate{--c:#A6B4BD}
  .tg-amber{--c:#E5C34F}.tg-teal{--c:#5FCFD3}.tg-rose{--c:#F08AAA}.tg-indigo{--c:#949CF5}
}

/* ===== Info panels ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px}
.panel-h{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--ink-2);margin-bottom:8px}
.panel-h .upd{margin-left:auto;font-weight:400;font-size:.72rem;color:var(--ink-3)}
.panel{display:flex;flex-direction:column}
.panel-more{
  margin-top:auto;padding-top:12px;align-self:flex-start;
  display:inline-flex;align-items:center;gap:5px;
  font-size:.82rem;font-weight:700;color:var(--board);
}
.panel-more svg{font-size:.85rem}
.panel-more:hover{text-decoration:underline;text-underline-offset:3px}
.big{font-size:1.9rem;font-weight:700;line-height:1.15}
.big small{font-size:.95rem;font-weight:400;color:var(--ink-2);margin-left:8px}
.sub{font-size:.85rem;color:var(--ink-2);margin-top:2px}
.facts{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:8px}
.facts span{display:inline-flex;align-items:center;gap:4px}
.hours{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px;border-top:1px solid var(--line);padding-top:10px;text-align:center}
.hr-t{font-size:.7rem;color:var(--ink-3)}
.hr-i{font-size:1.05rem;line-height:1.5}
.hr-v{font-size:.8rem;font-weight:700}
.hr-p{font-size:.68rem;color:#2F6DB5;min-height:1em}
@media (prefers-color-scheme: dark){ .hr-p{color:#7FB2F0} }
.hours .now .hr-t{color:var(--board);font-weight:700}
.loading,.err{font-size:.85rem;color:var(--ink-3)}
.lv{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:8px;vertical-align:middle;
  color:var(--lc);background:color-mix(in srgb,var(--lc) 13%,transparent)}
.c-safe{--lc:var(--safe)}.c-caution{--lc:var(--caution)}.c-warn{--lc:var(--warn)}.c-danger{--lc:var(--danger)}.c-stop{--lc:var(--stop)}
.hr-v.c-safe,.hr-v.c-caution,.hr-v.c-warn,.hr-v.c-danger,.hr-v.c-stop{color:var(--lc)}
.panel.alert-on{border-color:var(--lc);box-shadow:inset 4px 0 0 var(--lc)}
.alert-state{font-size:1.15rem;font-weight:700;color:var(--lc,var(--ink))}

/* Quake */
.qk{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line);font-size:.82rem}
.qk dt{color:var(--ink-3)}
.qk dd{color:var(--ink)}
.shindo{display:inline-block;min-width:2.6em;text-align:center;font-weight:700;padding:0 6px;border-radius:4px;
  color:var(--lc,var(--ink-2));background:color-mix(in srgb,var(--lc,var(--ink-3)) 13%,transparent)}
.nankai{margin-top:10px;padding:8px 10px;border-radius:var(--radius-s);font-size:.82rem;font-weight:700;
  color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}

/* Trains */
.trains{list-style:none;display:flex;flex-direction:column}
.trains a{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:.88rem}
.trains li:last-child a{border-bottom:none}
.trains a:hover .tr-name{color:var(--board);text-decoration:underline;text-underline-offset:3px}
.tr-bar{width:4px;height:16px;border-radius:2px;background:var(--lc);flex-shrink:0}
.tr-name{font-weight:700}
.tr-st{font-size:.75rem;color:var(--ink-3);margin-left:8px}
.trains svg{margin-left:auto;color:var(--ink-3);font-size:.85rem}

/* Route */
.dir{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-bottom:8px}
.dir-txt{flex:1}
.ghost{background:none;border:1px solid var(--line-2);border-radius:var(--radius-s);padding:4px 10px;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.ghost:hover{border-color:var(--board);color:var(--board)}
.field{width:100%;padding:9px 12px;font-size:.9rem;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--radius-s)}
.field:focus{outline:none;border-color:var(--board);box-shadow:0 0 0 3px var(--board-soft)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0;background:var(--bg);padding:3px;border-radius:var(--radius-s)}
.mode{border:none;background:none;padding:6px 0;font-size:.78rem;border-radius:4px;cursor:pointer;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
.mode svg{font-size:1rem}
.mode[aria-pressed="true"]{background:var(--surface);color:var(--board);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.primary{width:100%;padding:10px;border:none;border-radius:var(--radius-s);background:var(--board);color:var(--board-ink);font-weight:700;cursor:pointer}
.primary:hover{filter:brightness(1.08)}

footer{
  max-width:1360px;margin:0 auto;padding:20px 24px 32px;
  display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;
  font-size:.8rem;color:var(--ink-3);
}
footer span{display:inline-flex;align-items:center;gap:6px}
footer a:hover{color:var(--board);text-decoration:underline}

/* ===== Responsive ===== */
@media (max-width:1180px){
  .info{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .top-inner,.day-inner{padding-left:16px;padding-right:16px}
  .wrap{padding:16px}
  /* スマホでは情報パネルを横スワイプにして、リンクまでの距離を短くする */
  .info{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 16px 4px;scroll-padding:0 16px}
  .info>.panel{flex:0 0 86%;scroll-snap-align:start}
  .cat-peek{display:none}
  .cat-count{margin-right:auto}
  .top-inner{gap:10px 16px}
  .brand{width:100%}
  .clock-time{font-size:1.4rem}
  .seg{font-size:0}          /* 細い帯ではラベルを隠し、上の「いま」表示に任せる */
  .seg.current{font-size:.72rem}
  .ticks span.mid{display:none}
  .links{grid-template-columns:1fr}
  .kbd,.search-hint{display:none}
  .finder{margin-bottom:16px}
  #q{padding-right:14px}
}
@media (prefers-reduced-motion:no-preference){
  .marker{transition:left 1s linear}
}
@media (prefers-reduced-motion:reduce){
  .cat-body,.cat-chev{transition:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <img src="favicon-180.png" alt="">
      <div>
        <div class="brand-name">新荏田西ポータル</div>
        <div class="brand-school">横浜市立荏田西小学校</div>
      </div>
    </div>
    <div class="clock">
      <span class="clock-date" id="clockDate"></span>
      <span class="clock-time num" id="clockTime"></span>
    </div>
    <div class="duty num" id="duty" hidden></div>
  </div>
</header>

<section class="day" aria-label="今日の時程">
  <div class="day-inner">
    <div class="day-head">
      <div class="day-now" id="dayNow"></div>
      <div class="day-note" id="dayNote"></div>
    </div>
    <div id="timeline"></div>
  </div>
</section>

<div class="info">
    <section class="panel" id="wg-alert" aria-live="polite">
      <div class="panel-h"><i data-lucide="siren"></i>警報・注意報（横浜市北部）<span class="upd"></span></div>
      <div class="loading">読み込み中…</div>
      <a class="panel-more" href="https://www.jma.go.jp/bosai/warning/#area_type=class20s&area_code=1410011" target="_blank" rel="noopener">気象庁で詳しく見る<i data-lucide="external-link"></i></a>
    </section>
    <section class="panel" id="wg-quake" aria-live="polite">
      <div class="panel-h"><i data-lucide="activity"></i>地震情報（青葉区）<span class="upd"></span></div>
      <div class="loading">読み込み中…</div>
      <a class="panel-more" href="https://www.jma.go.jp/bosai/map.html#contents=earthquake_map" target="_blank" rel="noopener">気象庁で詳しく見る<i data-lucide="external-link"></i></a>
    </section>
    <section class="panel" id="wg-weather">
      <div class="panel-h"><i data-lucide="cloud-sun"></i>天気（青葉区）<span class="upd"></span></div>
      <div class="loading">読み込み中…</div>
      <a class="panel-more" href="https://tenki.jp/forecast/3/17/4610/14117/1hour.html" target="_blank" rel="noopener">tenki.jp で詳しく見る<i data-lucide="external-link"></i></a>
    </section>
    <section class="panel" id="wg-wbgt">
      <div class="panel-h"><i data-lucide="thermometer-sun"></i>暑さ指数 WBGT（推定）<span class="upd"></span></div>
      <div class="loading">読み込み中…</div>
      <a class="panel-more" href="https://www.wbgt.env.go.jp/graph_ref_td.php?region=03&prefecture=46&point=46106" target="_blank" rel="noopener">環境省で詳しく見る<i data-lucide="external-link"></i></a>
    </section>
    <section class="panel" id="wg-train">
      <div class="panel-h"><i data-lucide="train-front"></i>電車の運行情報</div>
      <ul class="trains" id="trains"></ul>
      <a class="panel-more" href="https://transit.yahoo.co.jp/diainfo/area/4" target="_blank" rel="noopener">関東の運行情報一覧<i data-lucide="external-link"></i></a>
    </section>
    <section class="panel" id="wg-route">
      <div class="panel-h"><i data-lucide="map"></i>学校までのルート</div>
      <div class="dir">
        <span class="dir-txt" id="dirTxt">入力した地点から学校へ</span>
        <button class="ghost" id="swap" type="button"><i data-lucide="arrow-left-right"></i>入れ替え</button>
      </div>
      <input class="field" id="place" type="text" placeholder="出発地（例: 青葉台駅）">

    setOpen(sec, searching ? !sec.hidden : openSet.has(sec.dataset.name)));

}

  const open = !sec.classList.contains('open');
  if (q.value.trim()) { setOpen(sec, open); return; } // 検索中の開閉は記憶しない
  open ? openSet.add(name) : openSet.delete(name);
  saveOpen(); syncOpen();
});

  document.querySelectorAll('.lk').forEach(a => a.classList.remove('first'));
  document.querySelectorAll('.cat').forEach(sec => {

  } else {

  emptyEl.hidden = !(term && total === 0);
  if (term && total === 0) emptyEl.innerHTML = `「<b>${esc(q.value.trim())}</b>」に一致するリンクはありません。別の言葉で探すか、Esc で検索をクリアしてください。`;
  return first;
}

// ========== CLOCK / DUTY ==========
const WEEKDAYS = ['日','月','火','水','木','金','土'];
const DUTY_START = [8,15], DUTY_END = [16,45];
function at(now, h, m) { const d = new Date(now); d.setHours(h, m, 0, 0); return d; }
function hms(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}
function updateClock(now) {
  $('clockDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${WEEKDAYS[now.getDay()]}）`;
  $('clockTime').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const el = $('duty'), dow = now.getDay();
  if (dow === 0 || dow === 6) { el.hidden = true; return; }
  const start = at(now, ...DUTY_START), end = at(now, ...DUTY_END);
  el.hidden = false;
  if (now >= end)        el.textContent = '今日もお疲れさまでした';
  else if (now >= start) el.innerHTML = `退勤まで<b>${hms(end - now)}</b>`;
  else                   el.innerHTML = `勤務開始まで<b>${hms(start - now)}</b>`;
}

// ========== DAY TIMELINE ==========
const PERIODS = {
  MON_FRI: [
    [8,25, 9,10,'1時間目'],[9,10, 9,55,'2時間目'],[9,55,10,40,'3時間目'],
    [10,40,11, 0,'中休み'],[11, 0,11,45,'4時間目'],[11,45,12,30,'5時間目'],
    [12,30,13,15,'給食'],[13,15,13,35,'掃除'],[13,35,13,50,'スキルタイム'],
  ],
  WED: [
    [8,25, 9,10,'1時間目'],[9,10, 9,55,'2時間目'],[9,55,10,40,'3時間目'],
    [10,40,11, 0,'中休み'],[11, 0,11,45,'4時間目'],[11,45,12,30,'5時間目'],
    [12,30,13,15,'給食'],[13,15,13,35,'掃除'],
  ],
  TUE_THU: [
    [8,25, 9,10,'1時間目'],[9,10, 9,55,'2時間目'],[9,55,10,40,'3時間目'],
    [10,40,11, 0,'中休み'],[11, 0,11,45,'4時間目'],[11,45,12,30,'5時間目'],
    [12,30,13,15,'給食'],[13,15,13,35,'掃除'],[13,35,13,50,'昼休み'],
    [13,50,14,35,'6時間目'],
  ],
};
const SHORT = {'中休み':'中休','スキルタイム':'スキル','昼休み':'昼休'};
function getPeriodSchedule(dow) {
  if (dow===1||dow===5) return PERIODS.MON_FRI;
  if (dow===3) return PERIODS.WED;
  if (dow===2||dow===4) return PERIODS.TUE_THU;
  return null;
}
const toMin = (h, m) => h * 60 + m;
const fmtHM = m => `${Math.floor(m/60)}:${pad(m%60)}`;

let builtFor = null, segs = [];
function buildTimeline(sched) {
  const D0 = toMin(...DUTY_START), D1 = toMin(...DUTY_END), span = D1 - D0;
  segs = [];
  let cur = D0;
  sched.forEach(([sh,sm,eh,em,label]) => {
    const s = toMin(sh,sm), e = toMin(eh,em);
    if (s > cur) segs.push({s:cur, e:s, label:'朝', kind:'free'});
    segs.push({s, e, label, kind: /時間目/.test(label) ? 'class' : 'break'});
    cur = e;
  });
  if (cur < D1) segs.push({s:cur, e:D1, label:'放課後', kind:'free'});

  const pct = m => ((m - D0) / span * 100).toFixed(3) + '%';
  const html = segs.map(g => {
    const txt = g.kind === 'class' ? g.label.replace('時間目', '') : (SHORT[g.label] || g.label);
    const w = ((g.e - g.s) / span * 100).toFixed(3);
    return `<div class="seg ${g.kind}" style="width:${w}%" title="${g.label} ${fmtHM(g.s)}–${fmtHM(g.e)}">${txt}</div>`;
  }).join('');
  const ticks = [D0, toMin(10,0), toMin(12,0), toMin(14,0), D1]
    .map((m, i, a) => `<span class="${i && i < a.length-1 ? 'mid' : ''} num" style="left:${pct(m)}">${fmtHM(m)}</span>`).join('');
  $('timeline').innerHTML = `<div class="track">${html}<div class="marker" id="marker" hidden></div></div><div class="ticks">${ticks}</div>`;
}

function updateDay(now) {
  const dow = now.getDay(), sched = getPeriodSchedule(dow);
  const key = now.toDateString();
  if (!sched) {
    if (builtFor !== key) {
      $('timeline').innerHTML = '';
      $('dayNow').textContent = '今日は授業のない日です';
      $('dayNote').textContent = '';
      builtFor = key;
    }
    return;
  }
  if (builtFor !== key) { buildTimeline(sched); builtFor = key; }

  const D0 = toMin(...DUTY_START), D1 = toMin(...DUTY_END);
  const m = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  const marker = $('marker');
  marker.hidden = m < D0 || m > D1;
  marker.style.left = ((m - D0) / (D1 - D0) * 100) + '%';

  let idx = segs.findIndex(g => m >= g.s && m < g.e);
  document.querySelectorAll('.seg').forEach((el, i) => {
    el.classList.toggle('past', segs[i].e <= m);
    el.classList.toggle('current', i === idx);
  });

  const dayNow = $('dayNow'), note = $('dayNote');
  const nextClass = segs.find(g => g.kind === 'class' && g.s > m);
  if (m < D0) {
    dayNow.textContent = '勤務開始前';
    note.textContent = `1時間目は ${fmtHM(segs.find(g => g.kind === 'class').s)} から`;
  } else if (m >= D1) {
    dayNow.textContent = '勤務時間外';
    note.textContent = '';
  } else {
    const g = segs[idx];
    dayNow.innerHTML = `いま ${esc(g.label)}<span class="until num">${fmtHM(g.e)} まで（あと ${Math.ceil(g.e - m)} 分）</span>`;
    note.textContent = nextClass && g.kind !== 'class' ? `次は ${nextClass.label}（${fmtHM(nextClass.s)}〜）` : '';
  }
}

function tick() { const now = new Date(); updateClock(now); updateDay(now); }
tick();
setInterval(tick, 1000);

  95:['⛈','雷雨'], 96:['⛈','雷雨・ひょう'], 99:['⛈','激しい雷雨'],
};
const wmoInfo = code => WMO[code] || ['🌤','—'];
function windDirLabel(deg) {
  const d = ['北','北北東','北東','東北東','東','東南東','南東','南南東',
             '南','南南西','南西','西南西','西','西北西','北西','北北西'];
  return d[Math.round(deg / 22.5) % 16];
}
// 屋外WBGTの推定（小野・登内 2014 の式。気温℃・湿度%・日射kW/m²・風速m/s）
// 2026年10月の環境省実況値(横浜)と比べて日中の平均誤差 約0.8℃
function estimateWbgt(ta, rh, srWm2, ws) {
  const sr = srWm2 / 1000;
  return 0.735*ta + 0.0374*rh + 0.00292*ta*rh + 7.619*sr - 4.557*sr*sr - 0.0572*ws - 4.064;
}
function wbgtLevel(w) {
  if (w >= 31) return {label:'運動中止', cls:'c-stop',    advice:'原則すべての運動を中止'};
  if (w >= 28) return {label:'厳重警戒', cls:'c-danger',  advice:'激しい運動・長時間の屋外活動は中止'};
  if (w >= 25) return {label:'警戒',     cls:'c-warn',    advice:'積極的に休憩と水分補給を'};
  if (w >= 21) return {label:'注意',     cls:'c-caution', advice:'こまめに水分補給を'};
  return             {label:'ほぼ安全', cls:'c-safe',    advice:'通常どおり活動できます'};
}

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LNG}`
      + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,`
      + `precipitation,weather_code,wind_speed_10m,wind_direction_10m`
      + `&hourly=temperature_2m,weather_code,precipitation_probability,`
      + `relative_humidity_2m,shortwave_radiation,wind_speed_10m`
      + `&wind_speed_unit=ms&forecast_days=2&timezone=Asia%2FTokyo`;
    const d = await (await timedFetch(url)).json();
    const c = d.current, H = d.hourly;
    const now = new Date();
    let start = H.time.findIndex(t => {
      const tt = new Date(t);
      return tt.toDateString() === now.toDateString() && tt.getHours() === now.getHours();
    });
    if (start < 0) start = now.getHours();

    const wbgtAt = i => Math.round(estimateWbgt(
      H.temperature_2m[i], H.relative_humidity_2m[i], H.shortwave_radiation[i], H.wind_speed_10m[i]) * 10) / 10;
    const slots = [...Array(7).keys()].map(k => start + k).filter(i => i < H.time.length);
    const hourLabel = (i, k) => k === 0 ? '今' : new Date(H.time[i]).getHours() + '時';

    const [icon, desc] = wmoInfo(c.weather_code);
    setBody('wg-weather', `
      <div class="big num">${icon} ${Math.round(c.temperature_2m)}°<small>${desc}　体感 ${Math.round(c.apparent_temperature)}°</small></div>
      <div class="facts num">
        <span><i data-lucide="droplets"></i>湿度 ${c.relative_humidity_2m}%</span>
        <span><i data-lucide="wind"></i>${windDirLabel(c.wind_direction_10m)} ${c.wind_speed_10m.toFixed(1)}m/s</span>
        <span><i data-lucide="umbrella"></i>${c.precipitation}mm</span>
      </div>
      <div class="hours num">${slots.map((i, k) => `
        <div class="${k===0?'now':''}">
          <div class="hr-t">${hourLabel(i, k)}</div>
          <div class="hr-i">${wmoInfo(H.weather_code[i])[0]}</div>
          <div class="hr-v">${Math.round(H.temperature_2m[i])}°</div>
          <div class="hr-p">${H.precipitation_probability[i] > 0 ? H.precipitation_probability[i] + '%' : ''}</div>
        </div>`).join('')}</div>`);

    const w = wbgtAt(start), lv = wbgtLevel(w);
    setBody('wg-wbgt', `
      <div class="big num">${w}°<span class="lv ${lv.cls}">${lv.label}</span></div>
      <div class="sub">${lv.advice}</div>
      <div class="hours num">${slots.map((i, k) => {
        const v = wbgtAt(i);
        return `<div class="${k===0?'now':''}" title="${wbgtLevel(v).label}">
          <div class="hr-t">${hourLabel(i, k)}</div>
          <div class="hr-v ${wbgtLevel(v).cls}">${Math.round(v)}</div>
        </div>`;
      }).join('')}</div>`);
    stamp('wg-weather'); stamp('wg-wbgt');
  } catch {
    setBody('wg-weather', '<div class="err">天気を取得できませんでした。時間をおいて再読み込みしてください。</div>');
    setBody('wg-wbgt',    '<div class="err">暑さ指数を取得できませんでした。</div>');
  }
  drawIcons();
}

// 気象庁 警報・注意報コード → [名称, レベル]（2026年5月からの新しい防災気象情報）
// 大雨・土砂災害・高潮は レベル2注意報／3警報／4危険警報／5特別警報
const WARN_KINDS = {
  '10':['大雨注意報',2],'03':['大雨警報',3],'43':['大雨危険警報',4],'33':['大雨特別警報',5],
  '29':['土砂災害注意報',2],'09':['土砂災害警報',3],'49':['土砂災害危険警報',4],'39':['土砂災害特別警報',5],
  '19':['高潮注意報',2],'08':['高潮警報',3],'48':['高潮危険警報',4],'38':['高潮特別警報',5],
  '15':['強風注意報',2],'05':['暴風警報',3],'35':['暴風特別警報',5],
  '13':['風雪注意報',2],'02':['暴風雪警報',3],'32':['暴風雪特別警報',5],
  '12':['大雪注意報',2],'06':['大雪警報',3],'36':['大雪特別警報',5],
  '16':['波浪注意報',2],'07':['波浪警報',3],'37':['波浪特別警報',5],
  '14':['雷注意報',2],'17':['融雪注意報',2],'20':['濃霧注意報',2],'21':['乾燥注意報',2],
  '22':['なだれ注意報',2],'23':['低温注意報',2],'24':['霜注意報',2],'25':['着氷注意報',2],'26':['着雪注意報',2],
};
const AREA_CODE = '1410011'; // 横浜市北部（青葉区を含む）

async function fetchWarnings() {
  const panel = $('wg-alert');
  try {
    // 現象ごと（大雨・風・波…）の報告が配列で届くので、すべての報告から対象地域を集める
    const reports = await (await timedFetch('https://www.jma.go.jp/bosai/warning/data/r8/140000.json', 8000)).json();
    let found = false;
    const active = new Map();
    for (const r of reports) {
      const item = (r.warning?.class20Items || []).find(it => it.areaCode === AREA_CODE);
      if (!item) continue;
      found = true;
      for (const k of item.kinds || []) {
        if (k.code && k.status !== '解除' && k.status !== '発表警報・注意報はなし') active.set(k.code, k);
      }
    }
    if (!found) throw new Error('area not found');
    panel.classList.remove('alert-on','c-stop','c-danger','c-caution');
    if (!active.size) {
      setBody('wg-alert', '<div class="alert-state c-safe">発表なし</div><div class="sub">現在、警報・注意報は出ていません</div>');
    } else {
      const kinds = [...active.keys()].map(c => WARN_KINDS[c] || [`不明な情報（コード${c}）`, 2])
        .sort((a, b) => b[1] - a[1]);
      const top = kinds[0][1];
      const [cls, label] = top >= 5 ? ['c-stop',  '特別警報が発表中（レベル5）']
                         : top >= 4 ? ['c-stop',  '危険警報が発表中（レベル4）']
                         : top >= 3 ? ['c-danger','警報が発表中']
                         :            ['c-caution','注意報が発表中'];
      panel.classList.add('alert-on', cls);
      setBody('wg-alert', `<div class="alert-state">${label}</div><div class="sub">${kinds.map(k => esc(k[0])).join('、')}</div>`);
    }
    stamp('wg-alert');
  } catch {
    setBody('wg-alert', '<div class="err">警報・注意報を取得できませんでした。気象庁のサイトで確認してください。</div>');
  }
  drawIcons();
}

fetchWeather();
// ========== EARTHQUAKE ==========
// 気象庁の地震情報。青葉区（1411700）の震度を中心に、横浜市内（1410100〜1411800）の最大震度も見る
const AOBA = '1411700';
const SHINDO = ['1','2','3','4','5-','5+','6-','6+','7'];
const shindoRank  = v => SHINDO.indexOf(v);             // 観測なしは -1
const shindoLabel = v => v ? '震度' + v.replace('-', '弱').replace('+', '強') : '—';
const shindoCls   = v => shindoRank(v) >= 4 ? 'c-stop' : shindoRank(v) >= 3 ? 'c-danger' : shindoRank(v) >= 2 ? 'c-caution' : '';
const maxShindo   = list => list.reduce((m, v) => shindoRank(v) > shindoRank(m) ? v : m, null);

async function fetchQuake() {
  const panel = $('wg-quake');
  try {
    const list = await (await timedFetch('https://www.jma.go.jp/bosai/quake/data/list.json', 8000)).json();
    const seen = new Set(), quakes = [];
    for (const q of list) {                               // 新しい順。同じ地震は最新の報だけ使う
      if (!['震源・震度情報', '震度速報'].includes(q.ttl) || q.ift !== '発表' || seen.has(q.eid)) continue;
      seen.add(q.eid);
      const kana = (q.int || []).find(p => p.code === '14');
      if (!kana) continue;                                // 神奈川県で揺れを観測した地震だけ
      const cities = kana.city || [];
      quakes.push({
        at: new Date(q.at), place: q.anm, mag: q.mag,
        aoba: cities.find(c => c.code === AOBA)?.maxi || null,
        yokohama: maxShindo(cities.filter(c => /^141[01]/.test(c.code)).map(c => c.maxi)),
        kanagawa: kana.maxi,
      });
    }
    const nankai = list.find(q => /南海トラフ地震臨時情報/.test(q.ttl) && Date.now() - new Date(q.at) < 7 * 864e5);

    panel.classList.remove('alert-on', 'c-stop', 'c-danger');
    const recent = quakes.filter(q => Date.now() - q.at < 864e5);
    const worst = maxShindo(recent.map(q => q.aoba || q.yokohama).filter(Boolean));
    let head;
    if (shindoRank(worst) >= 4) {
      panel.classList.add('alert-on', 'c-stop');
      head = `<div class="alert-state">${shindoLabel(worst)}を観測</div><div class="sub">学校の地震対応（引き渡し基準など）を確認してください</div>`;
    } else if (shindoRank(worst) >= 3) {
      panel.classList.add('alert-on', 'c-danger');
      head = `<div class="alert-state">${shindoLabel(worst)}を観測</div><div class="sub">施設や通学路の状況を確認してください</div>`;
    } else if (worst) {
      head = `<div class="alert-state">24時間以内に${shindoLabel(worst)}</div><div class="sub">大きな揺れは観測されていません</div>`;
    } else {
      head = `<div class="alert-state c-safe">揺れの観測なし</div><div class="sub">24時間以内に青葉区・横浜市で観測された地震はありません</div>`;
    }

    const last = quakes[0];
    const when = d => `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const detail = last ? `
      <dl class="qk num">
        <dt>直近の地震</dt><dd>${when(last.at)}　${esc(last.place || '震源調査中')}${last.mag && !isNaN(last.mag) ? `　M${esc(last.mag)}` : ''}</dd>
        <dt>青葉区</dt><dd><span class="shindo ${shindoCls(last.aoba)}">${shindoLabel(last.aoba)}</span></dd>
        <dt>横浜市内最大</dt><dd><span class="shindo ${shindoCls(last.yokohama)}">${shindoLabel(last.yokohama)}</span></dd>
      </dl>` : '';
    const nankaiHtml = nankai ? `<div class="nankai">${esc(nankai.ttl)}が発表されています</div>` : '';
    setBody('wg-quake', head + nankaiHtml + detail);
    stamp('wg-quake');
  } catch {
    setBody('wg-quake', '<div class="err">地震情報を取得できませんでした。気象庁のサイトで確認してください。</div>');
  }
  drawIcons();
}

// ========== TRAINS ==========
// 運行状況は鉄道会社のデータをブラウザから直接読めないため、路線ごとの Yahoo!路線情報ページを開く
const LINES = [
  {name:'東急田園都市線',     near:'江田・市が尾',   color:'#20A288', id:114},
  {name:'ブルーライン',       near:'あざみ野',       color:'#1B6AB5', id:140},
  {name:'グリーンライン',     near:'センター北',     color:'#00A33C', id:539},
  {name:'JR横浜線',           near:'長津田・中山',   color:'#80C241', id:31},
  {name:'JR南武線',           near:'武蔵溝ノ口',     color:'#FFD400', id:34},
];
$('trains').innerHTML = LINES.map(l => `
  <li><a href="https://transit.yahoo.co.jp/diainfo/${l.id}/0" target="_blank" rel="noopener">
    <span class="tr-bar" style="--lc:${l.color}"></span>
    <span><span class="tr-name">${esc(l.name)}</span><span class="tr-st">${esc(l.near)}</span></span>
    <i data-lucide="external-link"></i>
  </a></li>`).join('');

fetchQuake();
setInterval(fetchQuake, 5 * 60 * 1000);
fetchWarnings();
setInterval(fetchWeather,  30 * 60 * 1000);
setInterval(fetchWarnings, 10 * 60 * 1000);

// ========== ROUTE ==========
const SCHOOL_ADDR = '横浜市青葉区荏田西4-5-1 荏田西小学校';
let mode = 'driving', schoolIsOrigin = false;
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.mode').forEach(x => x.setAttribute('aria-pressed', x === b));
  mode = b.dataset.mode;
}));
$('swap').addEventListener('click', () => {
  schoolIsOrigin = !schoolIsOrigin;
  $('dirTxt').textContent = schoolIsOrigin ? '学校から入力した地点へ' : '入力した地点から学校へ';
  $('place').placeholder  = schoolIsOrigin ? '目的地（例: 青葉台駅）' : '出発地（例: 青葉台駅）';
});
function openRoute() {
  const other = $('place').value.trim();
  if (!other) { $('place').focus(); return; }
  const origin = schoolIsOrigin ? SCHOOL_ADDR : other;
  const dest   = schoolIsOrigin ? other : SCHOOL_ADDR;
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}`
    + `&destination=${encodeURIComponent(dest)}&travelmode=${mode}`, '_blank', 'noopener');
}
$('routeBtn').addEventListener('click', openRoute);
$('place').addEventListener('keydown', e => { if (e.key === 'Enter') openRoute(); });

drawIcons();

// ========== PWA（ホーム画面に追加） ==========
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
